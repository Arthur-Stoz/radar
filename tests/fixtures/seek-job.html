ess, please apply now.</p>","abstract":"Vibrant small team that works well together. Part of a Christchurch legacy. \n","expiresAt":{"__typename":"SeekDateTime","dateTimeUtc":"2026-11-18T12:59:59.999Z"},"listedAt":{"__typename":"SeekDateTime","label":"4h ago","dateTimeUtc":"2026-10-18T23:17:47.055Z"},"salary":null,"workTypes":{"__typename":"JobWorkTypes","label":"Full time"},"location":{"__typename":"LocationInfo","label":"Christchurch Central, Canterbury"},"advertiser":{"name":"Dimitris Greek Food"}}}}};
