ards OUR TOMORROW.<\/p>","identifier":{"@type":"PropertyValue","name":"Spark New Zealand","value":"1247"},"datePosted":"2026-10-18","hiringOrganization":{"@type":"Organization","name":"Spark New Zealand","sameAs":"https://sparknz.co.nz"},"employmentType":"FULL_TIME","url":"https://jobs.co.nz/jobs/customer-advisor-15","directApply":false,"validThrough":"2026-11-17T18:22:33","jobLocation":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"NZ","addressRegion":"Canterbury","addressLocality":"Christchurch"}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Jobs","item":"https://jobs.co.nz/jobs"},{"@type":"ListItem","position":2,"name":"Canterbury","item":"https://jobs.co.nz/jobs-in-canterbury"},{"@type":"ListItem","position":3,"name":"Customer Advisor"}]}]}
