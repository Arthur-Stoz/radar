<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#FFFFFF;color:#0B0B0A;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#0B0B0A;text-decoration:none}
a:hover{color:#0B0B0A}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #00C97A;outline-offset:3px}
@keyframes rdPulse{0%{box-shadow:0 0 0 0 rgba(0,201,122,.55)}70%{box-shadow:0 0 0 7px rgba(0,201,122,0)}100%{box-shadow:0 0 0 0 rgba(0,201,122,0)}}
</style>
</helmet>
<div data-screen-label="Home returning" style="min-height:900px; background:#FFFFFF; font-family:'Geist',system-ui,sans-serif; color:#0B0B0A">
  <header style="height:72px; display:flex; align-items:center; justify-content:space-between; padding:0 40px">
    <a href="#" aria-label="Radar home" style="display:flex; align-items:baseline; gap:3px; padding:4px 2px">
      <span style="font-size:23px; font-weight:700; letter-spacing:-0.055em; line-height:1">Radar</span>
      <span style="width:7px; height:7px; border-radius:50%; background:#00C97A; display:inline-block"></span>
    </a>
    <nav style="display:flex; align-items:center; gap:4px; font-size:14px">
      <a href="#" style="height:36px; padding:0 14px; border-radius:999px; display:inline-flex; align-items:center; gap:7px" style-hover="background:#F5F5F4">Saved <span style="font-family:'Geist Mono',ui-monospace,monospace; font-size:12px; color:#6B6B6B">4</span></a>
      <a href="#" style="height:36px; padding:0 14px; border-radius:999px; display:inline-flex; align-items:center" style-hover="background:#F5F5F4">For employers</a>
    </nav>
  </header>

  <section style="display:flex; flex-direction:column; align-items:center; text-align:center; padding:64px 40px 96px">
    <a href="#" onClick="{{ noop }}" style="display:inline-flex; align-items:center; gap:9px; height:34px; padding:0 14px 0 12px; border-radius:999px; background:#F5F5F4; font-size:14px; margin-bottom:28px" style-hover="background:#ECECEA">
      {{ pulseDot }}
      <span>New since your last visit: <span style="font-family:'Geist Mono',ui-monospace,monospace; font-weight:500">37</span></span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </a>
    <h1 style="margin:0; font-size:84px; font-weight:650; letter-spacing:-0.047em; line-height:1.02">
      <span style="display:block">Every <span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center; width:0.88em; height:0.88em; border-radius:0.23em; background:linear-gradient(160deg,#FCEEDC,#F1D5B1); vertical-align:-0.1em; margin:0 0.02em; transform:rotate(-7deg); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(0,0,0,.04)"><img src="assets/icons/coffee.png" alt="" style="width:76%; height:76%; object-fit:contain"></span> job in</span>
      <span style="display:block"><span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center; width:0.88em; height:0.88em; border-radius:0.23em; background:linear-gradient(160deg,#ECF7DE,#CFE8B2); vertical-align:-0.1em; margin:0 0.02em; transform:rotate(6deg); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(0,0,0,.04)"><img src="assets/icons/kiwi.png" alt="" style="width:76%; height:76%; object-fit:contain"></span> New Zealand.</span>
      <span style="display:block"><span aria-hidden="true" style="display:inline-flex; align-items:center; justify-content:center; width:0.88em; height:0.88em; border-radius:0.23em; background:linear-gradient(160deg,#E8F1FC,#C8DCF4); vertical-align:-0.1em; margin:0 0.02em; transform:rotate(-4deg); box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 0 0 1px rgba(0,0,0,.04)"><img src="assets/icons/mountain.png" alt="" style="width:76%; height:76%; object-fit:contain"></span> One search.</span>
    </h1>

    <form onSubmit="{{ noop }}" role="search" style="width:720px; margin-top:44px; display:flex; align-items:center; gap:6px; height:64px; padding:0 7px 0 24px; background:#FFFFFF; border:1px solid #E8E8E6; border-radius:999px; box-shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px rgba(0,0,0,.05)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B0B0A" strokeWidth="2.2" strokeLinecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input value="{{ draft }}" onChange="{{ onDraft }}" placeholder="Search a job, a town or a perk" aria-label="Search every job in New Zealand" style="flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; padding:0 12px; font-size:19px; letter-spacing:-0.01em">
      <button type="submit" style="flex:none; height:50px; padding:0 26px; border-radius:999px; border:0; background:#0B0B0A; color:#FFFFFF; font-size:16px; font-weight:550; cursor:pointer" style-hover="background:#2A2A29">Search</button>
    </form>

    <sc-if value="{{ hasRecent }}" hint-placeholder-val="{{ true }}">
      <div style="width:720px; margin-top:32px; text-align:left">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px">
          <span style="font-size:14px; font-weight:600">Recently viewed</span>
          <button onClick="{{ clear }}" style="height:30px; padding:0 10px; border:0; border-radius:999px; background:transparent; font-size:13.5px; color:#6B6B6B; cursor:pointer" style-hover="background:#F5F5F4; color:#0B0B0A">Clear</button>
        </div>
        <div style="display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px">
          <sc-for list="{{ recent }}" as="r" hint-placeholder-count="4">
            <a href="#" onClick="{{ noop }}" style="display:flex; align-items:center; gap:10px; padding:8px; border-radius:12px; background:#F5F5F4; min-width:0" style-hover="background:#EFEFED">
              <span style="position:relative; flex:none; width:44px; height:44px; border-radius:9px; overflow:hidden; background:{{ r.grad }}; display:flex; align-items:center; justify-content:center">
                <sc-if value="{{ r.hasPhoto }}" hint-placeholder-val="{{ false }}"><img src="{{ r.photo }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></sc-if>
                <sc-if value="{{ r.noPhoto }}" hint-placeholder-val="{{ true }}"><img src="{{ r.icon }}" alt="" style="width:62%; height:auto"></sc-if>
              </span>
              <span style="min-width:0; display:flex; flex-direction:column; gap:2px">
                <span style="font-size:13.5px; font-weight:600; letter-spacing:-0.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">{{ r.title }}</span>
                <span style="font-size:12px; color:#6B6B6B; white-space:nowrap; overflow:hidden; text-overflow:ellipsis"><span style="font-family:'Geist Mono',ui-monospace,monospace; color:#0B0B0A">{{ r.pay }}</span> · {{ r.town }}</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ cleared }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:32px; font-size:13.5px; color:#6B6B6B">Recently viewed cleared on this device.</div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { draft: '', recentOn: true };
  static RECENT = [
    ['Barista', '$27–29/h', 'Ponsonby', 'ponsonby', null, 40],
    ['Kiwifruit picker', '$27/h', 'Te Puke', 'tepuke', null, 110],
    ['Head barista', '$30–34/h', 'Britomart', null, 'coffee', 220],
    ['Lodge host', '$27–30/h', 'Stewart Island', 'stewart', null, 20]
  ];
  grad(h) { return `radial-gradient(90% 80% at 15% 8%, oklch(0.95 0.045 ${h}) 0%, transparent 70%), oklch(0.925 0.045 ${(h + 20) % 360})`; }
  renderVals() {
    const h = React.createElement;
    return {
      draft: this.state.draft,
      onDraft: e => this.setState({ draft: e.target.value }),
      noop: e => e.preventDefault(),
      hasRecent: this.state.recentOn, cleared: !this.state.recentOn,
      clear: () => this.setState({ recentOn: false }),
      pulseDot: h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: '#00C97A', display: 'inline-block', flex: 'none', animation: 'rdPulse 2.2s ease-out infinite' } }),
      recent: Component.RECENT.map(([title, pay, town, photo, icon, hue]) => ({
        title, pay, town, hasPhoto: !!photo, noPhoto: !photo,
        photo: photo ? 'assets/photos/' + photo + '.jpg' : '', icon: 'assets/icons/' + (icon || 'coffee') + '.png', grad: this.grad(hue)
      }))
    };
  }
}
</script>
</body>
</html>
