<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#0B0B0A;color:#F5F5F4;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#F5F5F4;text-decoration:none}
a:hover{color:#F5F5F4}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #00C97A;outline-offset:3px}
@keyframes rdPulse{0%{box-shadow:0 0 0 0 rgba(0,201,122,.55)}70%{box-shadow:0 0 0 7px rgba(0,201,122,0)}100%{box-shadow:0 0 0 0 rgba(0,201,122,0)}}
</style>
</helmet>
<div data-screen-label="Results dark" style="min-height:900px; background:#0B0B0A; color:#F5F5F4; font-family:'Geist',system-ui,sans-serif">
  <header style="height:72px; display:grid; grid-template-columns:180px minmax(0,640px) minmax(0,1fr); align-items:center; padding:0 40px; border-bottom:1px solid #2A2A29">
    <div style="display:flex; align-items:baseline; gap:3px"><span style="font-size:23px; font-weight:700; letter-spacing:-0.055em; line-height:1">Radar</span><span style="width:7px; height:7px; border-radius:50%; background:#00C97A; display:inline-block"></span></div>
    <form onSubmit="{{ noop }}" role="search" style="display:flex; align-items:center; height:48px; padding:0 5px 0 18px; background:#161615; border:1px solid #2A2A29; border-radius:999px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" strokeWidth="2.2" strokeLinecap="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><line x1="16.5" y1="16.5" x2="21" y2="21"></line></svg>
      <input defaultValue="barista auckland" aria-label="Search jobs" style="flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; padding:0 10px; font-size:16px; color:#F5F5F4">
      <button type="submit" aria-label="Search" style="width:38px; height:38px; border-radius:999px; border:0; background:#F5F5F4; display:flex; align-items:center; justify-content:center; cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0B0A" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="13 6 19 12 13 18"></polyline></svg></button>
    </form>
    <span style="justify-self:end; font-size:13px; color:#A1A1A0">Free · No account</span>
  </header>
  <div style="display:grid; grid-template-columns:180px minmax(0,1fr); padding:12px 40px 0">
    <span></span>
    <div style="display:flex; gap:6px"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="2"><span style="height:28px; padding:0 6px 0 11px; border-radius:999px; background:#161615; box-shadow:inset 0 0 0 1px #2A2A29; display:inline-flex; align-items:center; gap:6px; font-size:13.5px">{{ c }}<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#A1A1A0" strokeWidth="2.8" strokeLinecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></span></sc-for></div>
  </div>
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:26px 40px 0">
    <div>
      <h1 style="margin:0; font-size:30px; font-weight:650; letter-spacing:-0.035em"><span style="font-family:'Geist Mono',ui-monospace,monospace; font-weight:500">248</span> jobs for “barista auckland”</h1>
      <div style="display:flex; align-items:center; gap:8px; margin-top:8px; font-size:14px; color:#A1A1A0">{{ pulseDot }}Updated 12 min ago</div>
    </div>
    <button style="height:36px; padding:0 14px; border-radius:999px; border:1px solid #2A2A29; background:#0B0B0A; display:inline-flex; align-items:center; gap:8px; font-size:14px; cursor:pointer" style-hover="background:#161615"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F5F5F4" strokeWidth="2" strokeLinejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><polyline points="3.5 6.5 12 13 20.5 6.5"></polyline></svg>Get these jobs by email</button>
  </div>
  <div style="display:flex; align-items:center; gap:16px; padding:20px 40px 0">
    <div style="flex:1; min-width:0; display:flex; align-items:center; gap:6px; overflow-x:auto; scrollbar-width:none; -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent)">
      <sc-for list="{{ pills }}" as="p" hint-placeholder-count="8"><button style="flex:none; height:36px; padding:0 14px; border-radius:999px; border:0; background:{{ p.bg }}; color:{{ p.fg }}; box-shadow:{{ p.ring }}; font-size:14px; white-space:nowrap; cursor:pointer">{{ p.label }}</button></sc-for>
      <span style="flex:none; width:1px; height:20px; background:#2A2A29; margin:0 4px"></span>
      <button style="flex:none; height:36px; padding:0 10px; margin-right:48px; border-radius:999px; border:0; background:transparent; color:#A1A1A0; font-size:14px; white-space:nowrap; cursor:pointer" style-hover="color:#F5F5F4">Clear all</button>
    </div>
    <button style="flex:none; height:36px; padding:0 14px; border-radius:999px; border:1px solid #2A2A29; background:#0B0B0A; font-size:14px; white-space:nowrap; cursor:pointer"><span style="color:#A1A1A0">Sort:</span> Most relevant ▾</button>
    <div style="flex:none; display:flex; padding:3px; gap:2px; border-radius:999px; background:#161615; box-shadow:inset 0 0 0 1px #2A2A29">
      <sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" style="height:30px; padding:0 12px; border-radius:999px; border:0; background:{{ v.bg }}; color:{{ v.fg }}; font-size:13.5px; cursor:pointer">{{ v.label }}</button></sc-for>
    </div>
  </div>
  <div style="padding:22px 40px 0; font-size:13.5px; color:#A1A1A0">Typical pay: <span style="font-family:'Geist Mono',ui-monospace,monospace; color:#F5F5F4">$26–$29/h</span> · median <span style="font-family:'Geist Mono',ui-monospace,monospace; color:#F5F5F4">$27/h</span></div>
  <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:36px 24px; padding:18px 40px 64px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
      <div style="position:relative">
        <a href="#" style="display:flex; flex-direction:column; gap:12px">
          <div style="position:relative; aspect-ratio:16/11; border-radius:14px; overflow:hidden; background:{{ c.grad }}; display:flex; align-items:center; justify-content:center">
            <sc-if value="{{ c.hasPhoto }}" hint-placeholder-val="{{ false }}"><img src="{{ c.photo }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover"></sc-if>
            <sc-if value="{{ c.noPhoto }}" hint-placeholder-val="{{ true }}"><img src="assets/icons/coffee.png" alt="" style="width:30%; transform:rotate({{ c.rot }}deg); filter:drop-shadow(0 14px 16px rgba(0,0,0,.4))"></sc-if>
            <div style="position:absolute; inset:0; border-radius:14px; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"></div>
          </div>
          <div style="display:flex; flex-direction:column; gap:5px; padding:0 2px">
            <div style="display:flex; align-items:baseline; justify-content:space-between; gap:12px"><span style="font-size:16.5px; font-weight:600; letter-spacing:-0.015em">{{ c.title }}</span><span style="flex:none; font-family:{{ c.payFam }}; font-size:14px; font-weight:500; color:{{ c.payC }}">{{ c.pay }}</span></div>
            <span style="font-size:14px; color:#A1A1A0">{{ c.where }}</span>
            <div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:5px"><sc-for list="{{ c.badges }}" as="b" hint-placeholder-count="2"><span style="height:23px; padding:0 9px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:{{ b.fw }}; background:{{ b.bg }}; color:{{ b.fg }}; box-shadow:{{ b.bd }}"><sc-if value="{{ b.dot }}" hint-placeholder-val="{{ false }}"><span style="width:6px; height:6px; border-radius:50%; background:#00C97A"></span></sc-if>{{ b.label }}</span></sc-for></div>
            <span style="margin-top:4px; font-size:12.5px; color:#A1A1A0">on {{ c.source }} · {{ c.ago }}</span>
          </div>
        </a>
        <button onClick="{{ c.save }}" aria-label="Save job" aria-pressed="{{ c.saved }}" style="position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:999px; border:0; background:rgba(11,11,10,.72); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ c.bmFill }}" stroke="#F5F5F4" strokeWidth="2.1" strokeLinejoin="round"><path d="M6 3h12v18l-6-4.5L6 21z"></path></svg></button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { view: 'grid', saved: { kowhai: 1 } };
  static CARDS = [
    ['kowhai', 'Barista', '$27–29/h', 'Kōwhai Café · Ponsonby, Auckland', 'Backpacker Board', '2h ago', 'ponsonby', 40, ['New', 'Meals', 'Tips', 'WHV friendly']],
    ['ritual', 'Head barista', '$30–34/h', 'Ritual Espresso Bar · Britomart, Auckland', 'Seek', '5h ago', null, 220, ['Rare find']],
    ['fig', 'Weekend barista', '$25–28/h', 'Fig & Fern · Grey Lynn, Auckland', 'Facebook', '6h ago', null, 30, ['New', 'Tips', 'No experience']],
    ['matiatia', 'Barista & café all-rounder', '$27–30/h', 'Matiatia Wharf Café · Waiheke Island, Auckland', 'Trade Me', '1h ago', 'waiheke', 100, ['New', 'Rare find', 'Accommodation', 'Meals']],
    ['tidal', 'Morning barista', 'Pay not listed', 'Tidal Coffee · Takapuna, Auckland', 'Seek', '9h ago', null, 200, ['New']],
    ['heron', 'Café barista', '$27/h', 'The Grey Heron · Devonport, Auckland', 'Facebook', '3h ago', null, 160, ['New', 'Closing soon']]
  ];
  badge(l) {
    if (l === 'New') return { label: l, bg: '#00C97A', fg: '#00261A', fw: 600, bd: 'none', dot: false };
    if (l === 'Rare find') return { label: l, bg: '#F5F5F4', fg: '#0B0B0A', fw: 600, bd: 'none', dot: true };
    if (l === 'Closing soon') return { label: l, bg: 'transparent', fg: '#F5F5F4', fw: 500, bd: 'inset 0 0 0 1px #4A4A48', dot: false };
    return { label: l, bg: '#161615', fg: '#E8E8E6', fw: 500, bd: 'inset 0 0 0 1px #2A2A29', dot: false };
  }
  grad(hue) { return `radial-gradient(90% 80% at 15% 8%, oklch(0.34 0.04 ${hue}) 0%, transparent 70%), radial-gradient(80% 90% at 95% 100%, oklch(0.3 0.06 ${(hue + 45) % 360}) 0%, transparent 72%), oklch(0.24 0.03 ${(hue + 20) % 360})`; }
  renderVals() {
    const s = this.state, h = React.createElement;
    return {
      noop: e => e.preventDefault(),
      pulseDot: h('span', { style: { width: 8, height: 8, borderRadius: '50%', background: '#00C97A', display: 'inline-block', flex: 'none', animation: 'rdPulse 2.2s ease-out infinite' } }),
      chips: ['barista', 'Auckland'],
      pills: ['Region', 'Near me', 'Pay: $26+/h', 'Job type', 'Perks', 'Open to working holiday visa', 'No experience', 'Starts soon', 'Posted', 'Source'].map((label, i) => ({
        label, bg: i === 2 ? '#F5F5F4' : '#161615', fg: i === 2 ? '#0B0B0A' : '#F5F5F4', ring: i === 2 ? 'none' : 'inset 0 0 0 1px #2A2A29'
      })),
      views: ['Grid', 'List', 'Map'].map(label => ({ label, bg: s.view === label.toLowerCase() ? '#F5F5F4' : 'transparent', fg: s.view === label.toLowerCase() ? '#0B0B0A' : '#A1A1A0', pick: () => this.setState({ view: label.toLowerCase() }) })),
      cards: Component.CARDS.map(([id, title, pay, where, source, ago, photo, hue, b], i) => ({
        title, pay, where, source, ago, grad: this.grad(hue), rot: [-6, 5, -3, 7, -5, 4][i],
        hasPhoto: !!photo, noPhoto: !photo, photo: photo ? 'assets/photos/' + photo + '.jpg' : '',
        payFam: pay === 'Pay not listed' ? "'Geist',system-ui,sans-serif" : "'Geist Mono',ui-monospace,monospace", payC: pay === 'Pay not listed' ? '#A1A1A0' : '#F5F5F4',
        badges: b.map(l => this.badge(l)), saved: !!s.saved[id], bmFill: s.saved[id] ? '#F5F5F4' : 'none',
        save: () => this.setState(st => ({ saved: { ...st.saved, [id]: !st.saved[id] } }))
      }))
    };
  }
}
</script>
</body>
</html>
