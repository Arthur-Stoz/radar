<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#FFFFFF;color:#0B0B0A;font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #00C97A;outline-offset:3px}
</style>
</helmet>
<div onPointerDown="{{ activate }}" data-screen-label="Keyboard shortcuts" style="position:absolute; inset:0; overflow:hidden; background:#FFFFFF; font-family:'Geist',system-ui,sans-serif; color:#0B0B0A">
  <header style="height:72px; display:grid; grid-template-columns:180px minmax(0,640px) 1fr; align-items:center; padding:0 40px">
    <div style="display:flex; align-items:baseline; gap:3px"><span style="font-size:23px; font-weight:700; letter-spacing:-0.055em; line-height:1">Radar</span><span style="width:7px; height:7px; border-radius:50%; background:#00C97A; display:inline-block"></span></div>
    <div style="height:48px; border-radius:999px; border:1px solid #E8E8E6; display:flex; align-items:center; padding:0 18px; gap:12px; font-size:16px">barista auckland<span style="flex:1"></span><span style="height:24px; padding:0 8px; border-radius:6px; background:#F5F5F4; font-family:'Geist Mono',ui-monospace,monospace; font-size:12px; color:#6B6B6B; display:inline-flex; align-items:center">⌘K</span></div>
    <button onClick="{{ open }}" style="justify-self:end; height:36px; padding:0 12px; border-radius:999px; border:0; background:transparent; display:inline-flex; align-items:center; gap:8px; font-size:13.5px; color:#6B6B6B; cursor:pointer" style-hover="background:#F5F5F4">Shortcuts <span style="width:22px; height:22px; border-radius:6px; background:#F5F5F4; font-family:'Geist Mono',ui-monospace,monospace; font-size:12px; display:inline-flex; align-items:center; justify-content:center">?</span></button>
  </header>
  <div style="padding:24px 40px 0; display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:24px">
    <div style="aspect-ratio:16/11; border-radius:14px; background:url('assets/photos/ponsonby.jpg') center/cover; box-shadow:0 0 0 2px #FFFFFF, 0 0 0 4px #00C97A"></div>
    <div style="aspect-ratio:16/11; border-radius:14px; background:linear-gradient(160deg,#EAF1FB,#C9DAF2)"></div>
    <div style="aspect-ratio:16/11; border-radius:14px; background:linear-gradient(160deg,#FCEEDC,#F1D5B1)"></div>
  </div>

  <div onClick="{{ close }}" style="position:absolute; inset:0; z-index:10; background:rgba(11,11,10,.34); opacity:{{ op }}; pointer-events:{{ pe }}; transition:opacity .25s ease"></div>
  <div role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" style="position:absolute; left:50%; top:50%; z-index:11; width:520px; margin-left:-260px; transform:translateY(-50%) scale({{ scale }}); opacity:{{ op }}; pointer-events:{{ pe }}; transition:opacity .2s ease, transform .3s cubic-bezier(.2,.8,.2,1); border-radius:20px; background:#FFFFFF; padding:26px 28px 22px; box-shadow:0 0 0 1px rgba(0,0,0,.06), 0 30px 80px rgba(0,0,0,.18)">
    <div style="display:flex; align-items:center; justify-content:space-between">
      <h2 style="margin:0; font-size:22px; font-weight:650; letter-spacing:-0.03em">Keyboard shortcuts</h2>
      <button onClick="{{ close }}" aria-label="Close" style="width:36px; height:36px; border-radius:999px; border:0; background:#F5F5F4; display:flex; align-items:center; justify-content:center; cursor:pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0B0B0A" strokeWidth="2.6" strokeLinecap="round"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg></button>
    </div>
    <div style="margin-top:18px; display:flex; flex-direction:column">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:52px; border-top:1px solid #F0F0EE">
          <span style="font-size:15px">{{ r.label }}</span>
          <span style="display:flex; align-items:center; gap:6px; font-size:13px; color:#6B6B6B">
            <sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="1">
              <sc-if value="{{ k.isOr }}" hint-placeholder-val="{{ false }}"><span>or</span></sc-if>
              <sc-if value="{{ k.isKey }}" hint-placeholder-val="{{ true }}"><kbd style="min-width:30px; height:30px; padding:0 9px; border-radius:8px; background:#F5F5F4; box-shadow:inset 0 -1px 0 #E3E3E1; font-family:'Geist Mono',ui-monospace,monospace; font-size:13px; font-weight:500; color:#0B0B0A; display:inline-flex; align-items:center; justify-content:center">{{ k.k }}</kbd></sc-if>
            </sc-for>
          </span>
        </div>
      </sc-for>
    </div>
    <p style="margin:12px 0 0; font-size:12.5px; color:#6B6B6B">Press <span style="font-family:'Geist Mono',ui-monospace,monospace; color:#0B0B0A">?</span> anywhere to open this.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;frame&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { open: this.props.open ?? true };
  componentDidMount() {
    if (!this.props.frame) window.__rkActive = this;
    this.onKey = e => {
      if (window.__rkActive !== this) return;
      if (e.key === '?') this.setState({ open: true });
      else if (e.key === 'Escape') this.setState({ open: false });
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const o = this.state.open;
    const keys = arr => arr.flatMap((k, i) => (i ? [{ isOr: true, isKey: false, k: '' }] : []).concat(k.split('+').map(x => ({ isKey: true, isOr: false, k: x }))));
    return {
      activate: () => { window.__rkActive = this; },
      op: o ? 1 : 0, pe: o ? 'auto' : 'none', scale: o ? 1 : 0.97,
      open: () => this.setState({ open: true }), close: () => this.setState({ open: false }),
      rows: [
        ['Search', ['/', '⌘+K']],
        ['Next job', ['J']],
        ['Previous job', ['K']],
        ['Save or unsave the open job', ['S']],
        ['Close the panel or this sheet', ['Esc']]
      ].map(([label, k]) => ({ label, keys: keys(k) }))
    };
  }
}
</script>
</body>
</html>
